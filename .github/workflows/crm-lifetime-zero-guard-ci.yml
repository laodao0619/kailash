name: CRM lifetime zero-net guard
on:
  pull_request:
    paths:
      - 'lib/crm-lifetime-tier.js'
      - 'tests/crm-lifetime-tier.test.js'
      - '.github/workflows/crm-lifetime-zero-guard-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22','26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check lib/crm-lifetime-tier.js
          node --check tests/crm-lifetime-tier.test.js
      - name: Run CRM tier guard regressions
        run: node --test tests/crm-lifetime-tier.test.js
