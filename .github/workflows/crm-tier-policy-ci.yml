name: CRM 2026-11-12 tier policy regression
on:
  push:
    branches: ['fix/crm-lifetime-tiers']
    paths:
      - '.github/workflows/crm-tier-policy-ci.yml'
      - 'lib/crm-tier-policy.js'
      - 'lib/crm-rfm.js'
      - 'lib/crm-segmentation.js'
      - 'lib/kbi-*.js'
      - 'api/bi-*.js'
      - 'tests/*.test.js'
  pull_request:
    paths:
      - 'lib/crm-tier-policy.js'
      - 'lib/crm-rfm.js'
      - 'lib/crm-segmentation.js'
      - 'lib/kbi-*.js'
      - 'api/bi-*.js'
      - 'tests/*.test.js'
      - '.github/workflows/crm-tier-policy-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify tier and RFM JavaScript syntax
        run: |
          node --check lib/crm-tier-policy.js
          node --check lib/crm-rfm.js
          node --check lib/kbi-ledger-adapter.js
          node --check lib/kbi-rfm.js
          node --check lib/kbi-rfm-cube.js
      - name: Run all synthetic CRM and BI tests
        run: node --test tests/*.test.js
