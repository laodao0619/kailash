name: KBI V1 read-only tests
on:
  pull_request:
    paths:
      - 'api/bi-journey.js'
      - 'api/bi-customers.js'
      - 'api/bi-overview.js'
      - 'api/bi-ingestion-status.js'
      - 'lib/crm-shopify.js'
      - 'lib/crm-gmail.js'
      - 'tests/kbi-journey.test.js'
      - 'tests/kbi-customers.test.js'
      - 'tests/kbi-overview.test.js'
      - 'tests/kbi-ingestion-status.test.js'
      - 'tests/kbi-rfm.test.js'
      - 'lib/kbi-rfm.js'
      - 'lib/kbi-ledger-adapter.js'
      - 'lib/kbi-customer-profile.js'
      - 'tests/kbi-customer-profile.test.js'
      - 'tests/kbi-ledger-adapter.test.js'
      - 'public/bi/index.html'
      - '.github/workflows/kbi-v1-tests.yml'
  push:
    branches: ['feat/kbi-v1-readonly']
    paths:
      - 'api/bi-journey.js'
      - 'api/bi-customers.js'
      - 'api/bi-overview.js'
      - 'api/bi-ingestion-status.js'
      - 'lib/crm-shopify.js'
      - 'lib/crm-gmail.js'
      - 'tests/kbi-journey.test.js'
      - 'tests/kbi-customers.test.js'
      - 'tests/kbi-overview.test.js'
      - 'tests/kbi-ingestion-status.test.js'
      - 'tests/kbi-rfm.test.js'
      - 'lib/kbi-rfm.js'
      - 'lib/kbi-ledger-adapter.js'
      - 'lib/kbi-customer-profile.js'
      - 'tests/kbi-customer-profile.test.js'
      - 'tests/kbi-ledger-adapter.test.js'
      - 'public/bi/index.html'
      - '.github/workflows/kbi-v1-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax validation
        run: |
          node --check api/bi-journey.js
          node --check api/bi-customers.js
          node --check api/bi-overview.js
          node --check api/bi-ingestion-status.js
          node --check lib/kbi-rfm.js
          node --check lib/kbi-ledger-adapter.js
          node --check lib/kbi-customer-profile.js
          node --check lib/crm-shopify.js
          node --check lib/crm-gmail.js
          node --check tests/kbi-journey.test.js
          node --check tests/kbi-customers.test.js
          node --check tests/kbi-overview.test.js
          node --check tests/kbi-ingestion-status.test.js
          node --check tests/kbi-rfm.test.js
          node --check tests/kbi-ledger-adapter.test.js
          node --check tests/kbi-customer-profile.test.js
      - name: Run zero-secret unit tests
        run: node --test tests/kbi-journey.test.js tests/kbi-customers.test.js tests/kbi-rfm.test.js tests/kbi-ledger-adapter.test.js tests/kbi-customer-profile.test.js tests/kbi-overview.test.js tests/kbi-ingestion-status.test.js
      - name: Validate inline workbench JavaScript
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync("public/bi/index.html","utf8");const a=s.indexOf("<script>");const b=s.indexOf("</script>",a);if(a<0||b<0)process.exit(2);fs.writeFileSync("/tmp/kbi-workbench.js",s.slice(a+8,b));'
          node --check /tmp/kbi-workbench.js
