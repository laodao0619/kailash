name: Kailash BI full CRM tests
on:
  pull_request:
    paths:
      - 'api/bi-*.js'
      - 'lib/kbi-*.js'
      - 'tests/kbi-*.test.js'
      - 'public/bi/**'
      - 'vercel.json'
      - '.github/workflows/kbi-v1-tests.yml'
  push:
    branches: ['main','feat/kbi-production-readonly-qa','feat/kbi-v3-all-modules-timeline-ux']
    paths:
      - 'api/bi-*.js'
      - 'lib/kbi-*.js'
      - 'tests/kbi-*.test.js'
      - 'public/bi/**'
      - 'vercel.json'
      - '.github/workflows/kbi-v1-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          for file in api/bi-*.js lib/kbi-*.js tests/kbi-*.test.js; do
            node --check "$file"
          done
          node -e 'const fs=require("fs");const s=fs.readFileSync("public/bi/index.html","utf8");const a=s.indexOf("<script>");const b=s.indexOf("</script>",a);if(a<0||b<0)process.exit(2);fs.writeFileSync("/tmp/kbi-workbench.js",s.slice(a+8,b));'
          node --check /tmp/kbi-workbench.js
          node --check public/bi/timeline-range.js
          node --check public/bi/workbench-modules.js
          node --check public/bi/rfm-3d.js
          node --check public/bi/ops-center.js
      - name: Execute all synthetic BI tests
        run: node --test tests/kbi-*.test.js
