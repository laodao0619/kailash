name: CRM finance writeback gate CI

on:
  pull_request:
    paths:
      - 'api/crm-orders-reconcile.js'
      - 'lib/crm-finance-writeback-gate.js'
      - 'tests/crm-finance-writeback-gate.test.js'
      - '.github/workflows/crm-finance-gate-ci.yml'
  push:
    branches:
      - 'fix/crm-finance-writeback-gate-20261116'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-writeback-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate finance writeback files
        run: |
          node --check lib/crm-finance-writeback-gate.js
          node --check api/crm-orders-reconcile.js
          node --check tests/crm-finance-writeback-gate.test.js
      - name: Run fail-closed finance approval tests
        run: node --test tests/crm-finance-writeback-gate.test.js
