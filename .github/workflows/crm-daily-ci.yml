name: CRM daily incremental CI
on:
  pull_request:
    paths:
      - 'api/crm-daily-*.js'
      - 'api/crm-status.js'
      - 'lib/crm-daily-state.js'
      - 'tests/crm-daily-*.test.js'
      - 'vercel.json'
      - '.github/workflows/crm-daily-ci.yml'
  push:
    branches: ['feat/crm-daily-incremental']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JS syntax
        run: |
          node --check lib/crm-daily-state.js
          node --check api/crm-daily-customers.js
          node --check api/crm-daily-orders.js
          node --check api/crm-daily-gmail.js
          node --check api/crm-status.js
          node --check tests/crm-daily-state.test.js
          node --check tests/crm-daily-customers.test.js
          node --check tests/crm-daily-orders.test.js
          node --check tests/crm-daily-gmail.test.js
          node --check tests/crm-daily-gmail-checkpoint.test.js
          node --check tests/crm-daily-cron.test.js
      - name: Verify cron is incremental-only
        run: |
          node -e 'const c=require("./vercel.json").crons;const names=c.map(x=>x.path);if(names.some(x=>["/api/crm-backfill","/api/crm-gmail-stage","/api/crm-orders-stage","/api/crm-orders-reconcile"].includes(x)))process.exit(1);for(const name of ["/api/crm-daily-customers","/api/crm-daily-orders","/api/crm-daily-gmail","/api/crm-gmail-filtered"])if(!names.includes(name))process.exit(1)'
      - name: Run pure and mock connector tests
        run: node --test tests/crm-daily-state.test.js tests/crm-daily-customers.test.js tests/crm-daily-orders.test.js tests/crm-daily-gmail.test.js tests/crm-daily-gmail-checkpoint.test.js tests/crm-daily-cron.test.js
