name: Case writeback safety tests

on:
  pull_request:
    paths:
      - 'lib/crm-case-*.js'
      - 'api/crm-cases-schema-preflight.js'
      - 'api/crm-cases-schema-preflight.js'
      - 'lib/crm-feishu.js'
      - 'tests/crm-case-*.test.js'
      - '.github/workflows/case-writeback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/crm-case-*.js'
      - 'lib/crm-feishu.js'
      - 'tests/crm-case-*.test.js'
      - '.github/workflows/case-writeback-tests.yml'

permissions:
  contents: read

jobs:
  case-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated dependencies (repository has no package-lock)
        run: npm install --ignore-scripts --no-audit --no-fund --no-save --package-lock=false
      - name: Check protected Case schema preflight syntax
        run: |
          node --check api/crm-cases-schema-preflight.js
          node --check lib/crm-case-schema-preflight.js
      - name: Run isolated Case writeback regression tests
        run: node --test tests/crm-case-*.test.js
