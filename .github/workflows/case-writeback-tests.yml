name: Case writeback safety tests

on:
  pull_request:
    paths:
      - 'lib/crm-case-*.js'
      - 'lib/crm-feishu.js'
      - 'tests/crm-case-*.test.js'
      - '.github/workflows/case-writeback-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/crm-case-*.js'
      - 'lib/crm-feishu.js'
      - 'tests/crm-case-*.test.js'
      - '.github/workflows/case-writeback-tests.yml'

permissions:
  contents: read

jobs:
  case-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Case writeback regression tests
        run: node --test tests/crm-case-*.test.js
